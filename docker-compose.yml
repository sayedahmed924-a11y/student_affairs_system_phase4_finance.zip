services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-student_affairs}
      POSTGRES_USER: ${DB_USER:-student_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-student_admin} -d ${DB_NAME:-student_affairs}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: sh -c "python manage.py migrate --fake-initial --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backup_data:/app/backups

  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    command: sh -c 'while true; do python manage.py backup_database; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups

volumes:
  postgres_data:
  media_data:
  static_data:
  backup_data:
