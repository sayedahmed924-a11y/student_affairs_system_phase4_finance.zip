<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}نظام شؤون الطلاب{% endblock %}</title>
<style>
:root{--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--brand:#174a7e;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:#12395f;color:white;padding:16px 4%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header a{color:white;text-decoration:none;margin-inline-start:16px}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}
h1{font-size:25px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 3px 12px #0f172a08}
.num{font-size:30px;font-weight:bold;color:var(--brand)}.muted{color:var(--muted);font-size:13px}
a.btn,button{display:inline-block;background:var(--brand);color:white;border:0;border-radius:8px;padding:10px 15px;text-decoration:none;cursor:pointer;font:inherit}
.btn.secondary{background:#e8eef5;color:#183b5b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}th{background:#edf3f8}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;margin:5px 0 12px}
label{font-weight:bold;font-size:14px}form p{margin:8px 0}.errorlist{color:#b91c1c}
.notice{padding:12px;background:#e8f5ed;border-radius:8px;margin-bottom:12px}
@media(max-width:650px){header nav{display:flex;flex-wrap:wrap;gap:10px}table{display:block;overflow:auto}}
</style></head>
<body><header><strong>🎓 نظام شؤون الطلاب</strong><nav>
<a href="/">الرئيسية</a><a href="/students/">الطلاب</a><a href="/students/add/">إضافة طالب</a><a href="/students/import/">Excel</a><a href="/students/audit/">سجل التعديلات</a><a href="/students/academic/">الشؤون الأكاديمية</a><a href="/students/finance/">الإدارة المالية</a><a href="/students/reports/">التقارير</a>
{% if user.is_authenticated %}<form method="post" action="/logout/" style="display:inline">{% csrf_token %}<button type="submit" style="background:transparent;padding:0;color:white">خروج</button></form>{% endif %}</nav></header>
<div class="wrap">{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}</div></body></html>
