databases:
  - name: student-affairs-demo-db
    databaseName: student_affairs_demo
    user: student_affairs_demo
    plan: free
    region: frankfurt

services:
  - type: web
    name: student-affairs-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1"
    healthCheckPath: /login/
    initialDeployHook: python manage.py setup_demo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-affairs-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: HTTPS_ENABLED
        value: "1"
      - key: TRUST_PROXY_SSL
        value: "1"
      - key: TIME_ZONE
        value: Africa/Cairo
      - key: DEMO_PASSWORD
        sync: false
